name: Portão

# Governança do GitHub (10/10/2026, Fase 1, itens 4 e 5). O check "portao" é o único exigido pelo ruleset do main.
# Aqui ele depende só da varredura de segredos (gitleaks nos commits novos, binário oficial com sha256 conferido).
# Testes próprios do repositório, quando existirem, entram como novos jobs na lista "needs" do portão.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  varredura:
    name: varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks nos commits novos
        env:
          VERSAO: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then FAIXA="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then FAIXA="${{ github.event.before }}..${{ github.sha }}"
          else FAIXA="-1"; fi
          /tmp/gitleaks git . --redact --no-banner --log-opts="$FAIXA" --exit-code 1

  formato:
    name: formato do log público e testes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - run: python3 scripts/ancora_radar.py formato
      - run: python3 -m pip install -q pytest==8.3.5 && python3 -m pytest -q tests

  portao:
    name: portao
    if: always()
    needs: [varredura, formato]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todos os jobs aprovados ou pulados
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTADOS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "o portão fecha: há job com falha ou cancelado"; exit 1
          fi
          echo "o portão abre"
